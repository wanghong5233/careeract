[project]
name = "careeract-browser"
version = "0.1.0"
license = "Apache-2.0"
requires-python = ">=3.11,<3.14"
dependencies = [
    "browser-use",
    "fastapi",
    "httpx",
    "playwright",
    "pydantic-settings",
    "uvicorn[standard]",
]

[tool.uv]
package = false

[tool.uv.sources]
browser-use = { path = "../../vendor/browser-use", editable = true }
