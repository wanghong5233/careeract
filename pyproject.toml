[project]
name = "careeract-workspace"
version = "0.1.0"
description = "CareerAct development workspace"
license = "Apache-2.0"
requires-python = ">=3.11,<3.14"
dependencies = []

[dependency-groups]
dev = [
    "httpx",
    "mypy",
    "pytest",
    "pytest-asyncio",
    "ruff",
]

[tool.uv]
package = false
default-groups = ["dev"]

[tool.uv.workspace]
members = ["services/api", "services/browser", "services/worker"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
explicit_package_bases = true
mypy_path = "."

[[tool.mypy.overrides]]
module = ["agno", "agno.*", "alembic", "alembic.*"]
follow_untyped_imports = false
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
