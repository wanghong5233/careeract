name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.2"
      - run: uv sync --frozen --all-packages --group dev
      - run: uv run ruff format --check services tests
      - run: uv run ruff check services tests
      - run: uv run mypy services tests
      - run: uv run pytest

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    env:
      API_BASE_URL: http://localhost:8000
      AUTH_DATABASE_URL: postgresql://careeract:careeract@localhost:5432/careeract
      BETTER_AUTH_SECRET: ci-only-secret-ci-only-secret-32ch
      BETTER_AUTH_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: "22.21.1"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
