name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  changes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Check commit subjects and changed paths
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BASE: ${{ github.event.before }}
          PUSH_HEAD: ${{ github.sha }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            python scripts/check_changes.py --range "$PR_BASE..$PR_HEAD"
          elif [ "$PUSH_BASE" != "0000000000000000000000000000000000000000" ]; then
            python scripts/check_changes.py --range "$PUSH_BASE..$PUSH_HEAD"
          else
            python scripts/check_changes.py --range "$PUSH_HEAD^!"
          fi

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.2"
      - run: uv sync --frozen --all-packages --group dev
      - run: uv run ruff format --check services tests scripts/check_changes.py scripts/check_secrets.py
      - run: uv run ruff check services tests scripts/check_changes.py scripts/check_secrets.py
      - run: uv run mypy services tests scripts/check_changes.py scripts/check_secrets.py
      - run: uv run pytest

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    env:
      API_BASE_URL: http://localhost:8000
      AUTH_DATABASE_URL: postgresql://careeract:careeract@localhost:5432/careeract
      BETTER_AUTH_SECRET: ci-only-secret-ci-only-secret-32ch
      BETTER_AUTH_URL: http://localhost:3100
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: "22.21.1"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
