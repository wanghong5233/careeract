name: Secrets

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.2"
      - name: Install Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          version=8.30.1
          archive="gitleaks_${version}_linux_x64.tar.gz"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${version}"
          cd "$RUNNER_TEMP"
          curl --fail --location --retry 3 -O "$base/$archive"
          curl --fail --location --retry 3 -O "$base/gitleaks_${version}_checksums.txt"
          grep " $archive$" "gitleaks_${version}_checksums.txt" | sha256sum --check --strict
          mkdir -p gitleaks-bin
          tar -xzf "$archive" -C gitleaks-bin gitleaks
          echo "$RUNNER_TEMP/gitleaks-bin" >> "$GITHUB_PATH"
      - run: python scripts/check_secrets.py --history
      - run: python -m unittest discover -s tests/security
